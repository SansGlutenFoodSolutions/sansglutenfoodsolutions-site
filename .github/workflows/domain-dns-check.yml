name: One-off domain DNS check

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DNS and RDAP
        run: |
          set -e
          echo "=== NS ==="
          dig +short NS sansglutenfoodsolutions.com || true
          echo "=== WWW A ==="
          dig +short A www.sansglutenfoodsolutions.com || true
          echo "=== WWW CNAME ==="
          dig +short CNAME www.sansglutenfoodsolutions.com || true
          echo "=== RDAP registrar + nameservers ==="
          curl -sS https://rdap.verisign.com/com/v1/domain/sansglutenfoodsolutions.com | python -c 'import json,sys; d=json.load(sys.stdin); print("registrar:", next((e.get("vcardArray",[None,[["fn",{}, "text",""]]])[1][0][3] for e in d.get("entities",[]) if "registrar" in e.get("roles",[])), "")); print("nameservers:", [n.get("ldhName") for n in d.get("nameservers",[])])'
