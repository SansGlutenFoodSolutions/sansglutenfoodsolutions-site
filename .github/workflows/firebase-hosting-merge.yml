name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANS_GLUTEN_FOOD_SOLUTIONS }}
          channelId: live
          projectId: sans-gluten-food-solutions

      - name: Authenticate to Google Cloud for one-off www redirect setup
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANS_GLUTEN_FOOD_SOLUTIONS }}

      - name: Configure www custom-domain redirect
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json, os, sys
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          creds.refresh(Request())
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json",
          }

          domain = "www.sansglutenfoodsolutions.com"
          target = "sansglutenfoodsolutions.com"
          base = (
              "https://firebasehosting.googleapis.com/v1beta1/"
              "projects/sans-gluten-food-solutions/sites/sans-gluten-food-solutions/customDomains"
          )
          url = f"{base}/{domain}"

          r = requests.get(url, headers=headers, timeout=30)
          if r.status_code == 200:
              print("Custom domain exists; setting redirect target.")
              out = requests.patch(
                  url,
                  params={"updateMask": "redirectTarget"},
                  headers=headers,
                  json={"redirectTarget": target},
                  timeout=30,
              )
          elif r.status_code == 404:
              print("Creating custom domain with redirect target.")
              out = requests.post(
                  base,
                  params={"customDomainId": domain},
                  headers=headers,
                  json={"redirectTarget": target},
                  timeout=30,
              )
          else:
              print(f"Unexpected GET status: {r.status_code}")
              print(r.text)
              sys.exit(1)

          print(f"Mutation status: {out.status_code}")
          print(out.text)
          out.raise_for_status()
          PY
