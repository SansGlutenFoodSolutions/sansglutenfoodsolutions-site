name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANS_GLUTEN_FOOD_SOLUTIONS }}
          channelId: live
          projectId: sans-gluten-food-solutions

      - name: Authenticate to Google Cloud for www domain status check
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SANS_GLUTEN_FOOD_SOLUTIONS }}

      - name: Check www custom-domain status
        run: |
          set -euo pipefail
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json, os
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_file(
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"],
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          creds.refresh(Request())
          headers = {"Authorization": f"Bearer {creds.token}"}
          url = (
              "https://firebasehosting.googleapis.com/v1beta1/"
              "projects/sans-gluten-food-solutions/sites/sans-gluten-food-solutions/"
              "customDomains/www.sansglutenfoodsolutions.com"
          )
          r = requests.get(url, headers=headers, timeout=30)
          print(f"Status check HTTP: {r.status_code}")
          r.raise_for_status()
          data = r.json()
          wanted = {
              "name": data.get("name"),
              "hostState": data.get("hostState"),
              "ownershipState": data.get("ownershipState"),
              "redirectTarget": data.get("redirectTarget"),
              "reconciling": data.get("reconciling"),
              "requiredDnsUpdates": data.get("requiredDnsUpdates"),
              "issues": data.get("issues"),
              "cert": data.get("cert"),
          }
          print(json.dumps(wanted, indent=2, ensure_ascii=False))
          PY
