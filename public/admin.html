<script>
(function () {
  function normalize(s) {
    return (s || '').replace(/\s+/g, ' ').trim();
  }

  function removeLikelyStripe(labelEl) {
    var parent = labelEl && labelEl.parentElement;
    if (!parent) return;

    var prev = labelEl.previousElementSibling;
    if (prev) {
      var t = normalize(prev.textContent);
      var r = prev.getBoundingClientRect();
      if (
        t === '' ||
        r.width <= 90 ||
        /flag|france|stripe|liseret|line|bar|divider|separator|icon/i.test((prev.className || '').toString())
      ) {
        prev.style.setProperty('display', 'none', 'important');
      }
    }

    Array.from(parent.children).forEach(function (el) {
      if (el === labelEl) return;
      var t = normalize(el.textContent);
      var r = el.getBoundingClientRect();
      var cls = (el.className || '').toString();
      var style = getComputedStyle(el);

      var smallEmptyVisual = t === '' && r.width <= 100 && r.height <= 35;
      var suspiciousClass = /stripe|liseret|divider|separator|france-flag|flag-line|tricolor/i.test(cls);
      var suspiciousGradient =
        (style.backgroundImage || '').includes('linear-gradient') &&
        r.width <= 120 && r.height <= 40;

      if (smallEmptyVisual || suspiciousClass || suspiciousGradient) {
        el.style.setProperty('display', 'none', 'important');
      }
    });
  }

  function patchFrance() {
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    var node;
    while ((node = walker.nextNode())) {
      var txt = normalize(node.nodeValue);
      if (txt === 'Fabriqué en France') {
        var label = node.parentElement;
        if (!label) continue;

        removeLikelyStripe(label);

          flag.className = 'sgfs-france-real-flag';

          label.insertBefore(flag, label.firstChild);
        }

        label.style.setProperty('display', 'inline-flex', 'important');
        label.style.setProperty('align-items', 'center', 'important');
        label.dataset.sgfsFranceFlagV2 = '1';

<script>
(function(){
  function norm(s){
    return (s || '').replace(/\s+/g,' ').trim();
  }

  function replaceTextInNode(root, fromRe, toText){
    if(!root) return;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    var n;
    while((n=walker.nextNode())){
      if(fromRe.test(n.nodeValue)){
        n.nodeValue=n.nodeValue.replace(fromRe,toText);
      }
    }
  }

  function removeCompositionParagraph(){
    var ps=Array.from(document.querySelectorAll('p'));
    ps.forEach(function(p){
      var t=norm(p.textContent);
      if(
        t.indexOf('Une liste volontairement courte et lisible')===0 &&
        t.indexOf('proportions')!==-1
      ){
        p.remove();
      }
    });
  }

  function patchFrenchFlags(){
    var labels=['Fabriqué en France','Fabrication française'];

    labels.forEach(function(labelText){
      var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
      var n;
      while((n=walker.nextNode())){
        if(norm(n.nodeValue)!==labelText) continue;

        var label=n.parentElement;
        if(!label || label.querySelector('.sgfs-fr-flag-vertical')) continue;

        var searchRoot=label;
        for(var up=0; up<3 && searchRoot.parentElement; up++){
          searchRoot=searchRoot.parentElement;
        }

        Array.from(searchRoot.querySelectorAll('*')).forEach(function(el){
          if(el===label || label.contains(el)) return;
          var txt=norm(el.textContent);
          var r=el.getBoundingClientRect();
          var st=getComputedStyle(el);
          var cls=(el.className||'').toString();

          var emptySmall = txt==='' && r.width>10 && r.width<=100 && r.height>2 && r.height<=35;
          var horizontalTricolor =
            (st.backgroundImage||'').indexOf('linear-gradient')!==-1 &&
            r.width>=20 && r.width<=100 && r.height<=30;
          var suspicious=/flag|france|tricolor|tricolore|liseret|stripe/i.test(cls);

          if(emptySmall && (horizontalTricolor || suspicious)){
            el.style.setProperty('display','none','important');
          }
        });

        var flag=document.createElement('span');
        flag.className='sgfs-fr-flag-vertical';
        flag.setAttribute('aria-label','Drapeau français');
        label.insertBefore(flag,label.firstChild);

        label.style.setProperty('display','inline-flex','important');
        label.style.setProperty('align-items','center','important');
      }
    });
  }

  function patchCrepes(){
    var bodyText=norm(document.body ? document.body.textContent : '');
    if(
      bodyText.indexOf('Nombre de crêpes')===-1 ||
      bodyText.indexOf('28 cm')===-1
    ) return;

    var labels=Array.from(document.querySelectorAll('label,p,div,span,strong'));
    var label=labels.find(function(el){
      return norm(el.textContent)==='Nombre de crêpes';
    });

    var input=null;
    if(label){
      var container=label.parentElement;
      for(var i=0;i<4 && container && !input;i++,container=container.parentElement){
        input=container.querySelector('input[type="number"]');
      }
    }
    if(!input){
      input=document.querySelector('input[type="number"]');
    }

    if(input){
      if(String(input.value)!=='20'){
        var proto=window.HTMLInputElement && window.HTMLInputElement.prototype;
        var desc=proto && Object.getOwnPropertyDescriptor(proto,'value');
        if(desc && desc.set){
          desc.set.call(input,'20');
        }else{
          input.value='20';
        }
        input.setAttribute('value','20');
        input.dispatchEvent(new Event('input',{bubbles:true}));
        input.dispatchEvent(new Event('change',{bubbles:true}));
      }
    }

    replaceTextInNode(document.body,/Pour\s+3\s+crêpes\b/g,'Pour 20 crêpes');
    replaceTextInNode(document.body,/pour\s+3\s+crêpes\b/g,'pour 20 crêpes');
  }

  function run(){
    removeCompositionParagraph();
    patchFrenchFlags();
    patchCrepes();
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',run,{once:true});
  }else{
    run();
  }

  setTimeout(run,250);
  setTimeout(run,900);
})();
</script>

<script>
(function(){
  function norm(s){
    return (s || '').replace(/\s+/g,' ').trim().toLowerCase();
  }

  function containsOne(text, arr){
    var t = norm(text);
    return arr.some(function(x){ return t.indexOf(norm(x)) !== -1; });
  }

  function scoreFlag(el){
    var txt = ((el.textContent || '') + ' ' + (el.outerHTML || '')).toLowerCase();
    var score = 0;
    if (/float|floating|wave|wavy|wav/.test(txt)) score += 50;
    if (el.tagName === 'IMG' || el.tagName === 'PICTURE') score += 20;
    if (el.tagName === 'SVG') score += 10;
    if ((el.getAttribute && (el.getAttribute('alt') || '').toLowerCase().indexOf('france') !== -1)) score += 10;
    if ((el.getAttribute && (el.getAttribute('src') || '').toLowerCase().indexOf('france') !== -1)) score += 10;
    if ((el.getAttribute && (el.getAttribute('src') || '').toLowerCase().indexOf('flag') !== -1)) score += 5;
    return score;
  }

  function flagCandidates(root){
    if (!root || !root.querySelectorAll) return [];
    return Array.from(root.querySelectorAll('img,svg,picture,span,i'))
      .filter(function(el){
        var cls = ((el.className || '') + '').toLowerCase();
        var alt = ((el.getAttribute && (el.getAttribute('alt') || '')) || '').toLowerCase();
        var aria = ((el.getAttribute && (el.getAttribute('aria-label') || '')) || '').toLowerCase();
        var src = ((el.getAttribute && (el.getAttribute('src') || '')) || '').toLowerCase();
        var txt = (el.textContent || '').trim();
        var html = (el.outerHTML || '').toLowerCase();

        if (txt === '🇫🇷') return true;
        if (el.tagName === 'IMG' || el.tagName === 'PICTURE' || el.tagName === 'SVG'){
          return /flag|france|french|drapeau|francais|français/.test(cls + ' ' + alt + ' ' + aria + ' ' + src + ' ' + html);
        }

        return /flag|france|french|drapeau|francais|français/.test(cls + ' ' + alt + ' ' + aria + ' ' + html);
      });
  }

  function getHeaderSelector(){
    var scopes = Array.from(document.querySelectorAll('header, nav, .site-header, .header, .topbar'));
    if (!scopes.length) scopes = [document.body];
    var candidates = [];

    scopes.forEach(function(scope){
      Array.from(scope.querySelectorAll('button,a,div,span')).forEach(function(el){
        var t = norm(el.textContent);
        if (!t) return;
        var hasLang = /\bfr\b/.test(t) || /\ben\b/.test(t);
        if (!hasLang) return;
        var flags = flagCandidates(el);
        if (!flags.length) return;
        var rect = (el.getBoundingClientRect ? el.getBoundingClientRect() : {width:0,height:0});
        if (rect.width > 320 || rect.height > 120) return;
        candidates.push(el);
      });
    });

    candidates.sort(function(a,b){
      var as = flagCandidates(a).length + (norm(a.textContent).indexOf('fr') !== -1 ? 3 : 0);
      var bs = flagCandidates(b).length + (norm(b.textContent).indexOf('fr') !== -1 ? 3 : 0);
      return bs - as;
    });

    return candidates[0] || null;
  }

  function chooseFlagFrom(root){
    var flags = flagCandidates(root).slice().sort(function(a,b){
      return scoreFlag(b) - scoreFlag(a);
    });
    return flags[0] || null;
  }

  function dedupeSelector(selector){
    if (!selector) return null;
    var flags = flagCandidates(selector).slice().sort(function(a,b){
      return scoreFlag(b) - scoreFlag(a);
    });
    if (!flags.length) return null;
    var keep = flags[0];
    flags.slice(1).forEach(function(el){
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });
    return keep;
  }

  function cloneFlag(flag){
    if (!flag) return null;
    var wrapper = document.createElement('span');
    wrapper.className = 'sgfs-single-floating-flag';
    wrapper.style.display = 'inline-flex';
    wrapper.style.alignItems = 'center';
    wrapper.style.justifyContent = 'center';
    wrapper.style.verticalAlign = 'middle';
    wrapper.style.marginRight = '12px';
    wrapper.appendChild(flag.cloneNode(true));
    return wrapper;
  }

  function textTargetElements(){
    var phrases = [
      'fabriqué en france',
      'fabrication française',
      'fabrication francaise',
      'made in france',
      'french manufacturing'
    ];

    return Array.from(document.querySelectorAll('div,span,p,strong,b,a,h2,h3,h4'))
      .filter(function(el){
        var t = norm(el.textContent);
        if (!t) return false;
        if (!containsOne(t, phrases)) return false;
        var rect = (el.getBoundingClientRect ? el.getBoundingClientRect() : {width:0,height:0});
        return rect.width <= 1000 && rect.height <= 180;
      });
  }

  function cleanTarget(target, sourceFlag){
    if (!target || !sourceFlag) return;
    var flags = flagCandidates(target);
    flags.forEach(function(el){
      if (el && el.parentNode) el.parentNode.removeChild(el);
    });

    var existing = target.querySelector('.sgfs-single-floating-flag');
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);

    var clone = cloneFlag(sourceFlag);
    if (!clone) return;

    var firstChild = target.firstChild;
    if (firstChild) {
      target.insertBefore(clone, firstChild);
    } else {
      target.appendChild(clone);
    }
  }

  function fixHeaderAndBadges(){
    var selector = getHeaderSelector();
    var keptFlag = dedupeSelector(selector) || chooseFlagFrom(selector);

    if (!keptFlag){
      var fallback = chooseFlagFrom(document.body);
      if (fallback) keptFlag = fallback;
    }

    if (selector && keptFlag){
      var extra = flagCandidates(selector).slice(1);
      extra.forEach(function(el){
        if (el && el.parentNode) el.parentNode.removeChild(el);
      });
    }

    if (!keptFlag) return;

    textTargetElements().forEach(function(el){
      cleanTarget(el, keptFlag);
    });

    // Nettoyage final : si un sélecteur contient encore plusieurs drapeaux, on garde le meilleur.
    Array.from(document.querySelectorAll('header *, nav *')).forEach(function(el){
      var t = norm(el.textContent);
      if (!(/\bfr\b/.test(t) || /\ben\b/.test(t))) return;
      var flags = flagCandidates(el);
      if (flags.length > 1){
        var keep = flags.slice().sort(function(a,b){ return scoreFlag(b) - scoreFlag(a); })[0];
        flags.forEach(function(f){
          if (f !== keep && f.parentNode) f.parentNode.removeChild(f);
        });
      }
    });
  }

  function run(){
    fixHeaderAndBadges();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', run, {once:true});
  } else {
    run();
  }

  setTimeout(run, 250);
  setTimeout(run, 800);
  setTimeout(run, 1500);
})();
</script>

<script>
(function(){
  function norm(s){
    return (s || '').replace(/\s+/g,' ').trim();
  }

  function isTopRight(el){
    if(!el || !el.getBoundingClientRect) return false;
    var r = el.getBoundingClientRect();
    return (
      r.top >= 0 &&
      r.top < 260 &&
      r.right > window.innerWidth * 0.62 &&
      r.width >= 45 &&
      r.width <= 240 &&
      r.height >= 24 &&
      r.height <= 100
    );
  }

  function looksLikeLangControl(el){
    var t = norm(el.textContent);
    return (
      /^FR(?:\s*[⌄⌃∨∧])?$/.test(t) ||
      /^🇫🇷\s*FR(?:\s*[⌄⌃∨∧])?$/.test(t) ||
      /^EN(?:\s*[⌄⌃∨∧])?$/.test(t) ||
      /^🇬🇧\s*EN(?:\s*[⌄⌃∨∧])?$/.test(t)
    );
  }

  function flagNodes(root){
    if(!root) return [];
    var out = [];

    Array.from(root.querySelectorAll('.sgfs-floating-fr-flag,img,svg,picture,i,span')).forEach(function(el){
      var cls = String(el.className || '').toLowerCase();
      var alt = (el.getAttribute && (el.getAttribute('alt') || '') || '').toLowerCase();
      var aria = (el.getAttribute && (el.getAttribute('aria-label') || '') || '').toLowerCase();
      var src = (el.getAttribute && (el.getAttribute('src') || '') || '').toLowerCase();
      var txt = norm(el.textContent);

      if(
        (el.classList && el.classList.contains('sgfs-floating-fr-flag')) ||
        txt === '🇫🇷' ||
        txt === '🇬🇧' ||
        /flag|drapeau|france|french|anglais|english/.test(cls+' '+alt+' '+aria+' '+src)
      ){
        out.push(el);
      }
    });

    return out;
  }

  function score(el){
    var s = 0;
    if(el.classList && el.classList.contains('sgfs-floating-fr-flag')) s += 100;
    var blob = (
      String(el.className || '') + ' ' +
      ((el.getAttribute && el.getAttribute('src')) || '') + ' ' +
      ((el.getAttribute && el.getAttribute('alt')) || '')
    ).toLowerCase();
    if(/float|floating|wave|wavy/.test(blob)) s += 50;
    if(el.tagName === 'SVG') s += 20;
    if(el.tagName === 'IMG') s += 10;
    return s;
  }

  function dedupeControl(el){
    var flags = flagNodes(el);
    if(flags.length <= 1) return;

    flags.sort(function(a,b){ return score(b) - score(a); });
    var keep = flags[0];

    flags.slice(1).forEach(function(f){
      if(f && f !== keep && f.parentNode){
        f.parentNode.removeChild(f);
      }
    });

    Array.from(el.childNodes).forEach(function(n){
      if(n.nodeType === Node.TEXT_NODE){
        n.nodeValue = (n.nodeValue || '').replace(/🇫🇷/g,'').replace(/🇬🇧/g,'');
      }
    });
  }

  function dedupe(){
    var scopes = Array.from(document.querySelectorAll('header,nav,.site-header,.header'));
    if(!scopes.length) scopes = [document.body];

    scopes.forEach(function(scope){
      Array.from(scope.querySelectorAll('button,a,[role="button"],[role="combobox"],div')).forEach(function(el){
        if(!isTopRight(el)) return;
        if(!looksLikeLangControl(el)) return;
        dedupeControl(el);
      });
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', dedupe, {once:true});
  }else{
    dedupe();
  }

  setTimeout(dedupe,200);
  setTimeout(dedupe,700);
  setTimeout(dedupe,1400);
})();
</script>

<script>
(function(){
  function norm(s){return (s||'').replace(/\s+/g,' ').trim()}
  function lower(s){return norm(s).toLowerCase()}
  function flagHTML(){
    return '' +
      '<span class="sgfs-fr-wave" aria-hidden="true">' +
        '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">' +
          '<defs><clipPath id="sgfsFrWaveClipOne"><path d="M2 5 C11 1 19 8 30 5 C41 2 50 8 58 4 L58 35 C50 39 41 33 30 36 C19 39 11 32 2 36 Z"/></clipPath></defs>' +
          '<g clip-path="url(#sgfsFrWaveClipOne)">' +
            '<rect x="0" y="0" width="20" height="40" fill="#0055A4"/>' +
            '<rect x="20" y="0" width="20" height="40" fill="#FFFFFF"/>' +
            '<rect x="40" y="0" width="20" height="40" fill="#EF4135"/>' +
            '<path d="M0 10 C12 6 18 13 30 10 C42 7 49 13 60 9" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>' +
            '<path d="M0 25 C12 21 18 28 30 25 C42 22 49 28 60 24" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>' +
          '</g>' +
          '<path d="M2 5 C11 1 19 8 30 5 C41 2 50 8 58 4 L58 35 C50 39 41 33 30 36 C19 39 11 32 2 36 Z" fill="none" stroke="rgba(0,0,0,.12)" stroke-width=".6"/>' +
        '</svg>' +
      '</span>';
  }
  function flagLike(el){
    if(!el) return false;
    var blob = (
      String(el.className || '') + ' ' +
      ((el.getAttribute && el.getAttribute('alt')) || '') + ' ' +
      ((el.getAttribute && el.getAttribute('aria-label')) || '') + ' ' +
      ((el.getAttribute && el.getAttribute('src')) || '') + ' ' +
      (el.textContent || '')
    ).toLowerCase();
    return (el.classList && el.classList.contains('sgfs-fr-wave')) || norm(el.textContent)==='🇫🇷' || /flag|drapeau|france|french|français|francais/.test(blob);
  }
  function findBanner(){
    var nodes = Array.from(document.querySelectorAll('div,p,span,strong'));
    for(var i=0;i<nodes.length;i++){
      var el = nodes[i];
      var t = norm(el.textContent);
      if(t.indexOf('Le Mix Universel BIO Sans Gluten Food Solutions est fabriqué en France.') !== -1){
        var cur = el;
        for(var j=0;j<6 && cur;j++,cur=cur.parentElement){
          if(!cur.getBoundingClientRect) continue;
          var r = cur.getBoundingClientRect();
          if(r.width >= 500 && r.height >= 45 && r.height <= 220){
            return cur;
          }
        }
      }
    }
    return null;
  }
  function run(){
    var banner = findBanner();
    if(!banner) return;
    banner.innerHTML = '<div class="sgfs-france-banner-content">' + flagHTML() + '<strong>Fabriqué en France</strong><span>Le Mix Universel BIO Sans Gluten Food Solutions est fabriqué en France.</span></div>';
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run, {once:true}); else run();
  setTimeout(run, 250);
  setTimeout(run, 900);
})();
</script>
<!-- /SGFS_SINGLE_FLAG_COMPOSITION_V1 -->

</body>
</html>
