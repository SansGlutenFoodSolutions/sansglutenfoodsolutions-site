name = "sgfs-checkout"
main = "src/index.js"
compatibility_date = "2026-11-11"

[[d1_databases]]
binding = "DB"
database_name = "sgfs-orders"
database_id = "cc2ee9be-c8f1-4483-8467-0731369e4687"

[vars]
CHECKOUT_ENABLED = "false"
STRIPE_PRICE_ID = "DISABLED_UNTIL_LAUNCH"

# Secrets à configurer dans Cloudflare : STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# SENDCLOUD_PUBLIC_KEY, SENDCLOUD_SECRET_KEY.
# SENDCLOUD_SENDER_ADDRESS_ID est facultatif (pour utiliser l'adresse et sa marque Sendcloud).
# Valeurs non secrètes facultatives : SENDCLOUD_FROM_POSTAL_CODE=13960,
# SENDCLOUD_FROM_CITY=Sausset-les-Pins.
