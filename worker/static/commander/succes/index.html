<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Suivi de commande | SGFS</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f1;color:#123b2a;font:16px/1.6 system-ui,sans-serif}header{background:white;padding:20px;text-align:center}header img{max-width:300px;width:80%}main{max-width:700px;margin:44px auto;padding:0 20px}.card{border:1px solid #d5e2d5;border-radius:22px;background:#fff;padding:30px}a{color:#03492f;font-weight:700}</style></head><body><header><a href="/"><img alt="Sans Gluten Food Solutions" src="https://sansglutenfoodsolutions.com/assets/sgfs-logo-horizontal-v26.png"></a></header><main><div class="card"><h1>Merci pour votre commande</h1><p id="state">Nous vérifions la confirmation du paiement Stripe.</p><div id="tracking"></div><p>La commande sera préparée uniquement après confirmation du paiement. Pour toute question : <a href="mailto:contact@sansglutenfoodsolutions.com">contact@sansglutenfoodsolutions.com</a>.</p></div></main><script src="/sgfs-checkout-config.js"></script><script>(()=>{const id=new URLSearchParams(location.search).get('session_id'),state=document.querySelector('#state'),tracking=document.querySelector('#tracking');if(!id){state.textContent='Aucune session de paiement trouvée.';return}async function poll(){try{const r=await fetch(window.SGFS_CHECKOUT_API_URL+'/order-status?session_id='+encodeURIComponent(id));const j=await r.json();if(j.status==='paid_fulfilled'){state.textContent='Paiement confirmé. Votre commande est enregistrée.';tracking.replaceChildren();const links=(j.shipments||[]).filter(x=>typeof x.tracking_url==='string'&&x.tracking_url.startsWith('https://'));for(const parcel of links){const p=document.createElement('p'),a=document.createElement('a');a.href=parcel.tracking_url;a.rel='noopener';a.textContent='Suivre le colis';p.append(a);tracking.append(p)}if(!links.length)tracking.textContent='Le numéro de suivi apparaîtra ici après la création de l’étiquette.'}else if(j.status==='paid'){state.textContent='Paiement confirmé. Votre expédition est en cours de préparation.'}else if(j.status==='awaiting_payment'||j.status==='payment_pending'||j.status==='processing'){state.textContent='Paiement en cours de vérification. Cette page se met à jour automatiquement.'}else if(j.status==='paid_shipment_error'){state.textContent='Paiement confirmé. L’expédition nécessite une vérification par notre équipe.'}else{state.textContent='Nous attendons la confirmation Stripe.'}}catch{}setTimeout(poll,5000)}poll()})();</script></body></html>
